{% extends "base.html" %}
{% block title %}{{ "Edit Skill" if record else "Add Skill" }} — Headhunter{% endblock %}
{% block content %}
<h1>{{ "Edit Skill" if record else "Add Skill" }}</h1>
<form method="post" action="{{ action }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Skill <input name="name" required maxlength="150" value="{{ record.name if record else '' }}"></label>
<label>Proficiency <input name="proficiency" maxlength="50" placeholder="Optional, e.g. Advanced" value="{{ record.proficiency if record else '' }}"></label>
<button type="submit">Save skill</button> <a href="/skills">Cancel</a>
</form>
{% endblock %}
