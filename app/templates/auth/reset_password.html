{% extends "base.html" %}
{% block title %}Reset Password — Headhunter{% endblock %}
{% block content %}
<section class="mx-auto max-w-md py-12">
    <div class="card bg-base-100 shadow-xl border border-base-200">
        <div class="card-body">
            <h1 class="card-title text-2xl">Choose a new password</h1>
            <form method="post" action="/auth/reset-password" class="space-y-5 mt-4">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="token" value="{{ token }}">
                <label class="form-control w-full">
                    <span class="label-text mb-2">New password</span>
                    <input class="input input-bordered w-full" type="password" name="new_password" required minlength="8" autocomplete="new-password">
                </label>
                <label class="form-control w-full">
                    <span class="label-text mb-2">Confirm new password</span>
                    <input class="input input-bordered w-full" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
                </label>
                <button class="btn btn-primary w-full" type="submit">Reset password</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
