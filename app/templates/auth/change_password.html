{% extends "base.html" %}

{% block title %}Change Password — Headhunter{% endblock %}

{% block content %}
<section class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-12">
    <div class="card w-full max-w-md bg-white shadow-xl border border-slate-100">
        <div class="card-body p-8 sm:p-10">

            <!-- Heading -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">
                    Change password
                </h1>
                <p class="mt-2 text-sm text-slate-500">
                    Update your password to keep your account secure.
                </p>
            </div>

            <!-- Form -->
            <form method="post" action="/auth/change-password" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="form-control w-full">
                    <label for="current_password" class="label">
                        <span class="label-text font-medium text-slate-700">
                            Current password
                        </span>
                    </label>
                    <input id="current_password"
                        class="input input-bordered w-full border-slate-200 bg-white focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                        type="password" name="current_password" required autocomplete="current-password">
                </div>

                <div class="form-control w-full">
                    <label for="new_password" class="label">
                        <span class="label-text font-medium text-slate-700">
                            New password
                        </span>
                    </label>
                    <input id="new_password"
                        class="input input-bordered w-full border-slate-200 bg-white focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                        type="password" name="new_password" required minlength="8" autocomplete="new-password">
                    <label class="label">
                        <span class="label-text-alt text-slate-400">
                            Minimum 8 characters
                        </span>
                    </label>
                </div>

                <div class="form-control w-full">
                    <label for="confirm_password" class="label">
                        <span class="label-text font-medium text-slate-700">
                            Confirm new password
                        </span>
                    </label>
                    <input id="confirm_password"
                        class="input input-bordered w-full border-slate-200 bg-white focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                        type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
                </div>

                <button class="btn btn-primary w-full border-0 shadow-lg shadow-blue-500/20" type="submit">
                    Change password
                </button>
            </form>

        </div>
    </div>
</section>
{% endblock %}
