{% extends "base.html" %}

{% block title %}Create Account — Headhunter{% endblock %}

{% block content %}

<section class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-12">

    <div class="card w-full max-w-md bg-white shadow-xl border border-slate-100">

        <div class="card-body p-8 sm:p-10">
            <!-- Heading -->
            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold text-slate-900">
                    Create your account
                </h1>

                <p class="mt-2 text-slate-500">
                    Build and share a professional digital CV portfolio.
                </p>

            </div>


            <!-- Registration Form -->
            <form method="post" action="/auth/register" class="space-y-5">

                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">


                <!-- Full Name -->
                <div class="form-control">

                    <label for="full_name" class="label">
                        <span class="label-text font-medium text-slate-700">
                            Full name
                        </span>
                    </label>

                    <input id="full_name" name="full_name"
                        class="input input-bordered w-full focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                        type="text" maxlength="150" autocomplete="name" required placeholder="John Doe">

                </div>


                <!-- Email -->
                <div class="form-control">

                    <label for="email" class="label">
                        <span class="label-text font-medium text-slate-700">
                            Email
                        </span>
                    </label>

                    <input id="email" name="email"
                        class="input input-bordered w-full focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                        type="email" maxlength="255" autocomplete="email" required placeholder="you@example.com">

                </div>


                <!-- Password -->
                <div class="form-control">

                    <label for="password" class="label">
                        <span class="label-text font-medium text-slate-700">
                            Password
                        </span>
                    </label>

                    <input id="password" name="password"
                        class="input input-bordered w-full focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                        type="password" minlength="8" maxlength="128" autocomplete="new-password" required
                        placeholder="Create a password">

                    <label class="label">
                        <span class="label-text-alt text-slate-400">
                            Minimum 8 characters
                        </span>
                    </label>

                </div>


                <!-- Confirm Password -->
                <div class="form-control">

                    <label for="confirm_password" class="label">
                        <span class="label-text font-medium text-slate-700">
                            Confirm password
                        </span>
                    </label>

                    <input id="confirm_password" name="confirm_password"
                        class="input input-bordered w-full focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                        type="password" minlength="8" maxlength="128" autocomplete="new-password" required
                        placeholder="Confirm your password">

                </div>


                <!-- Submit -->
                <button type="submit" class="btn btn-primary w-full border-0 shadow-lg shadow-blue-500/20">
                    Create account
                </button>

            </form>


            <!-- Login -->
            <div class="divider my-6"></div>

            <p class="text-center text-sm text-slate-500">

                Already have an account?

                <a href="/auth/login" class="link link-primary font-medium no-underline hover:underline">
                    Sign in
                </a>

            </p>

        </div>

    </div>

</section>

{% endblock %}
