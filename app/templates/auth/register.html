{% extends "base.html" %}

{% block title %}Create Account — Headhunter{% endblock %}

{% block content %}
<section>
    <h1>Create your account</h1>

    <p>
        Create an account to build and manage your CV portfolio.
    </p>

    <form method="post" action="/auth/register">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div>
            <label for="full_name">Full name</label>
            <input
                id="full_name"
                name="full_name"
                type="text"
                maxlength="150"
                autocomplete="name"
                required
            >
        </div>

        <div>
            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                maxlength="255"
                autocomplete="email"
                required
            >
        </div>

        <div>
            <label for="password">Password</label>
            <input
                id="password"
                name="password"
                type="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
            >
        </div>

        <div>
            <label for="confirm_password">Confirm password</label>
            <input
                id="confirm_password"
                name="confirm_password"
                type="password"
                minlength="8"
                maxlength="128"
                autocomplete="new-password"
                required
            >
        </div>

        <button type="submit">
            Create account
        </button>
    </form>

    <p>
        Already have an account?
        <a href="/auth/login">Sign in</a>
    </p>
</section>
{% endblock %}
