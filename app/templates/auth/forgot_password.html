{% extends "base.html" %}

{% block title %}Forgot Password — Headhunter{% endblock %}

{% block content %}
<section class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-12">
    <div class="card w-full max-w-md bg-white shadow-xl border border-slate-100">
        <div class="card-body p-8 sm:p-10">
            <!-- Heading -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">
                    Reset your password
                </h1>
                <p class="mt-2 text-sm leading-6 text-slate-500">
                    Enter your account email and we'll send reset instructions if the account exists.
                </p>
            </div>

            <!-- Form -->
            <form method="post" action="/auth/forgot-password" class="space-y-5">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="form-control w-full">
                    <label for="email" class="label">
                        <span class="label-text font-medium text-slate-700">
                            Email
                        </span>
                    </label>

                    <input id="email"
                        class="input input-bordered w-full border-slate-200 bg-white focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                        type="email" name="email" required autocomplete="email" placeholder="you@example.com">
                </div>

                <button class="btn btn-primary w-full border-0 shadow-lg shadow-blue-500/20" type="submit">
                    Send reset instructions
                </button>
            </form>

            <!-- Back to login -->
            <div class="mt-6 text-center">
                <a class="link link-primary text-sm font-medium no-underline hover:underline" href="/auth/login">
                    ← Back to sign in
                </a>
            </div>

        </div>
    </div>
</section>
{% endblock %}
