{% extends "base.html" %}

{% block title %}Sign In — Headhunter{% endblock %}

{% block content %}
<section class="min-h-screen bg-slate-50 flex items-center justify-center px-4 py-12">

    <div class="card w-full max-w-md bg-white shadow-xl border border-slate-100">

        <div class="card-body p-8 sm:p-10">
            <!-- Heading -->
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-900">
                    Sign in
                </h1>

                <p class="mt-2 text-slate-500">
                    Sign in to your account
                </p>
            </div>


            <!-- Login Form -->
            <form method="post" action="/auth/login" class="space-y-5">

                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">


                <!-- Email -->
                <div class="form-control">

                    <label for="email" class="label">
                        <span class="label-text font-medium text-slate-700">
                            Email
                        </span>
                    </label>

                    <input id="email" name="email" type="email" required autocomplete="email"
                        class="input input-bordered w-full focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                        placeholder="you@example.com">

                </div>


                <!-- Password -->
                <div class="form-control">

                    <label for="password" class="label">
                        <span class="label-text font-medium text-slate-700">
                            Password
                        </span>
                    </label>

                    <input id="password" name="password" type="password" autocomplete="current-password" required
                        class="input input-bordered w-full focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20"
                        placeholder="Enter your password">

                </div>


                <!-- Submit -->
                <button type="submit" class="w-full border-0 shadow-lg shadow-blue-500/20 cbtn-primary py-3">
                    Sign in
                </button>

            </form>


            <!-- Forgot Password -->
            <div class="text-center mt-5">
                <a class="link link-primary text-sm font-medium no-underline hover:underline"
                    href="/auth/forgot-password">
                    Forgot your password?
                </a>
            </div>


            <!-- Register -->
            <div class="divider my-6"></div>

            <p class="text-center text-sm text-slate-500">
                Don't have an account?
                <a href="/auth/register" class=" font-medium no-underline hover:underline">
                    Create one
                </a>
            </p>

        </div>

    </div>

</section>
{% endblock %}
