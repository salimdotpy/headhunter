<nav class="bg-white/80 backdrop-blur-md fixed w-full z-50 border-b border-slate-100 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">

            <div class="shrink-0 flex items-center cursor-pointer">
                {{app_logo()}}
            </div>

            <div class="flex items-center space-x-3 sm:space-x-6">
                {% if request.session.get("user_id") %}
                <a href="/dashboard">Dashboard</a>
                <a href="/auth/change-password">Change Password</a>
                <a href="/profile/edit">Profile</a>
                <a href="/education">CV</a>
                <a href="/documents">Documents</a>
                <a href="/portfolio/settings">Portfolio</a>
                {% if request.session.get("role") == "admin" %}
                <a href="/admin">Admin</a>
                {% endif %}
                <form method="post" action="/auth/logout" class="inline-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <button type="submit">Logout</button>
                </form>
                {% else %}
                <a href="{{ url_for('login_page' ) }}"
                    class="text-sm font-medium text-slate-600 hover:text-primary transition-colors hidden sm:block">
                    Log in
                </a>
                <a class="btn btn-primary shadow-lg shadow-blue-500/30" href="{{ url_for('register_page' ) }}">Get
                    Started</a>
                {% endif %}


            </div>
        </div>
    </div>
</nav>

{% block nav_scripts %}
<script>
    (() => {
        const toggle = document.getElementById('nav-toggle');
        const nav = document.getElementById('site-nav');
        if (!toggle || !nav) return;
        toggle.addEventListener('click', () => {
            const open = nav.classList.toggle('is-open');
            toggle.setAttribute('aria-expanded', String(open));
        });
    })();
</script>
{% endblock %}
