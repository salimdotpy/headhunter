{% macro app_logo(href="/", class_text='') %}
<a href="{{href}}" class="text-2xl font-black text-blue-700 tracking-tight flex items-center gap-2 {{class_text}}">
    <span class="icon-[lucide--briefcase] size-6"></span>
    Headhunter.
</a>
{% endmacro %}

{% macro admin_navbar(active="") %}
<nav class="overflow-x-auto scrollbar-thin rounded-2xl border border-slate-200 bg-white p-2 shadow-sm"
    aria-label="Admin navigation">
    <div class="flex min-w-max gap-1">
        <a href="/admin" class="btn btn-sm
        {% if active=='dashboard' %}
            bg-primary text-primary-content shadow-sm hover:bg-primary/90
        {% else %}
            btn-ghost text-slate-600 hover:bg-slate-100 hover:text-primary
        {% endif %}
        ">
            <span class="icon-[lucide--layout-dashboard] size-4"></span>
            Dashboard
        </a>

        <a href="/admin/users" class="btn btn-sm
        {% if active=='users' %}
            bg-primary text-primary-content shadow-sm hover:bg-primary/90
        {% else %}
            btn-ghost text-slate-600 hover:bg-slate-100 hover:text-primary
        {% endif %}
        ">
            <span class="icon-[lucide--users] size-4"></span>
            Users
        </a>

        <a href="/admin/portfolios" class="btn btn-sm
        {% if active=='portfolios' %}
            bg-primary text-primary-content shadow-sm hover:bg-primary/90
        {% else %}
            btn-ghost text-slate-600 hover:bg-slate-100 hover:text-primary
        {% endif %}
        ">
            <span class="icon-[lucide--briefcase-business] size-4"></span>
            Portfolios
        </a>

        <a href="/admin/content" class="btn btn-sm
        {% if active=='content' %}
            bg-primary text-primary-content shadow-sm hover:bg-primary/90
        {% else %}
            btn-ghost text-slate-600 hover:bg-slate-100 hover:text-primary
        {% endif %}
        ">
            <span class="icon-[lucide--file-text] size-4"></span>
            Website Content
        </a>

        <a href="/admin/activity" class="btn btn-sm
        {% if active=='activity' %}
            bg-primary text-primary-content shadow-sm hover:bg-primary/90
        {% else %}
            btn-ghost text-slate-600 hover:bg-slate-100 hover:text-primary
        {% endif %}
        ">
            <span class="icon-[lucide--activity] size-4"></span>
            Activity
        </a>

        <a href="/admin/settings" class="btn btn-sm
        {% if active=='settings' %}
            bg-primary text-primary-content shadow-sm hover:bg-primary/90
        {% else %}
            btn-ghost text-slate-600 hover:bg-slate-100 hover:text-primary
        {% endif %}
        ">
            <span class="icon-[lucide--settings] size-4"></span>
            Settings
        </a>
    </div>
</nav>
{% endmacro %}
